[project]
name = "semantic-search-benchmarker"
version = "0.1.0"
description = "Compare BM25 and semantic retrieval on technical documentation."
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.8,<3",
    "openai>=1.54,<3",
    "tiktoken>=0.8,<1",
    "faiss-cpu>=1.9,<2",
    "rank-bm25>=0.2.2,<0.3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
